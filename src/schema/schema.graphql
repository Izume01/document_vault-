scalar DateTime

type Collection {
  id: ID!
  name: String!
  slug: String!
  createdAt: DateTime!
  documents: [Document!]!
}

type Document {
  id: ID!
  title: String!
  content: String!
  tags: [String!]!
  collectionId: ID!
  collection: Collection!
  isArchived: Boolean!
  createdAt: DateTime!
}

type PageInfo {
  hasNextPage: Boolean!
  endCursor: String
}

type DocumentEdge {
  cursor: String!
  node: Document!
}

type DocumentConnection {
  edges: [DocumentEdge!]!
  nodes: [Document!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

input CreateCollectionInput {
  name: String!
  slug: String!
}

input CreateDocumentInput {
  title: String!
  content: String!
  tags: [String!]
  collectionId: ID!
}

input UpdateDocumentInput {
  title: String
  content: String
  tags: [String!]
  isArchived: Boolean
}

type Query {
  # Get all collections
  collections: [Collection!]!

  # Get a single collection by ID
  collection(id: ID!): Collection

  # Get documents with filtering, search, and cursor-based pagination
  documents(
    collectionId: ID
    search: String
    isArchived: Boolean
    take: Int
    cursor: String
  ): DocumentConnection!
}

type Mutation {
  # Create operations
  createCollection(input: CreateCollectionInput!): Collection!
  createDocument(input: CreateDocumentInput!): Document!

  # Update & Delete operations
  updateDocument(id: ID!, input: UpdateDocumentInput!): Document!
  deleteDocument(id: ID!): Boolean!

  # Move document to another collection
  moveDocument(id: ID!, collectionId: ID!): Document!
}